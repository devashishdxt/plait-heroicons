[package]
name = "plait-heroicons"
version = "0.2.0"
edition = "2024"
authors = ["Devashish Dixit <devashishdxt@gmail.com>"]
description = "Heroicons as plait components"
documentation = "https://docs.rs/plait-heroicons"
repository = "https://github.com/devashishdxt/plait-heroicons"
license = "MIT OR Apache-2.0"
keywords = ["heroicons", "plait", "html", "components", "icons"]
categories = ["web-programming"]
readme = "README.md"

[dependencies]
plait = { git = "https://github.com/devashishdxt/plait.git", rev = "42e3b39f1f6ddf120d908d0e9a78cab6de419734", default-features = false }

[dev-dependencies]
roxmltree = "0.21.1"

[build-dependencies]
roxmltree = "0.21.1"
convert_case = "0.11.0"
